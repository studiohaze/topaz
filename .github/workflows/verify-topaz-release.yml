name: Verify published Topaz release bytes
on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: github.event.repository.visibility == 'public' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      predicate: ${{ steps.check.outputs.predicate }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The tests feed the verifier changed signatures and seeds that reach
      # openssl and the byte comparison, so a weakened check stops here.
      - name: Test the verifier and the attestation policy offline
        shell: bash
        run: python3 -I -m unittest discover -s scripts -p 'test_*.py' -v
      - id: check
        name: Verify pinned release and public compiler materials
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/verify-topaz-release.py > "$RUNNER_TEMP/predicate.json"
          jq . "$RUNNER_TEMP/predicate.json"
          printf 'predicate=%s\n' "$(jq -c . "$RUNNER_TEMP/predicate.json")" >> "$GITHUB_OUTPUT"

  attest:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Every file the checks compare is a subject, so the attestation is not
      # read as a claim about the CLI alone.
      - name: List the verified files
        shell: bash
        env:
          PREDICATE: ${{ needs.verify.outputs.predicate }}
        run: |
          set -euo pipefail
          printf '%s' "$PREDICATE" | jq -er '
            "\(.subject.sha256)  \(.subject.name)",
            "\(.compilerRust.seedArchiveSha256)  \(.compilerRust.seedUrl | split("/") | last)",
            "\(.compilerRust.sha256)  \(.compilerRust.publicPath)"' > "$RUNNER_TEMP/subjects.txt"
          cat "$RUNNER_TEMP/subjects.txt"
      - name: Attest the static checks for the verified files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt
          predicate-type: https://github.com/studiohaze/topaz/attestations/static-release-bytes/v2
          predicate: ${{ needs.verify.outputs.predicate }}
          create-storage-record: false
