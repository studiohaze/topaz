[package]
name = "topaz-core-kit-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
workspace = ".."
publish = false
autobins = false
build = "../../core-kit/native/build.rs"

[features]
default = []
native-cli = []

[dependencies]
topaz_rt = { path = "../crates/topaz_rt" }
topaz_host_native = { path = "../crates/topaz_host_native" }
topaz_product_runtime = { path = "../crates/topaz_product_runtime" }
topaz_host_none = { path = "../crates/topaz_host_none" }
topaz_seed_compiler = { path = "../crates/topaz_seed_compiler" }

[build-dependencies]
topaz_value = { workspace = true }

[lints]
workspace = true

[lib]
path = "../../core-kit/native/src/lib.rs"

[[bin]]
name = "topaz-core-kit"
path = "../../core-kit/native/src/main.rs"
required-features = ["native-cli"]

[[bin]]
name = "topaz-core-kit-generate-cli"
path = "../../core-kit/native/src/bin/generate-cli.rs"

# The generator and shared adapter compile without generated CLI Rust.
# Enabling native-cli links the output selected by TOPAZ_CORE_KIT_GENERATED_CLI.
